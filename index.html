<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9BFE0">
<title>워드클라우드 참여 · GenZ Lab</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg rotate" aria-hidden="true"></div>

<main class="join">
  <div class="brand">
    <img src="assets/logo-navy.png" alt="GenZ Lab">
    <span class="bar"></span>
    <span class="name">GenZ Lab 워크샵</span>
  </div>

  <h1 id="question">불러오는 중…</h1>

  <!-- 전송 완료: 내가 보낸 단어 -->
  <section id="sent" class="glass card with-mascot" hidden>
    <img class="mascot" src="assets/glimming.png" alt="">
    <div class="sent-head">
      <span class="check"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.3l3 3 6-6.5"/></svg></span>
      <span>보냈어요! 화면을 확인해 보세요</span>
    </div>
    <div class="label">내가 보낸 단어</div>
    <div class="chips" id="sent-chips"></div>
  </section>

  <!-- 입력 -->
  <section id="form" class="glass card with-mascot" hidden>
    <img class="mascot" id="form-mascot" src="assets/glimming.png" alt="">
    <div class="card-title" id="form-title">떠오르는 단어를 적어 주세요</div>
    <div id="rows"></div>
    <button type="button" class="add" id="add">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>
      <span>단어 추가</span>
    </button>
  </section>

  <p class="hint" id="hint" hidden>이름 없이 익명으로 보내져요 · 한 단어에 15자까지</p>

  <!-- 응답 마감 -->
  <section id="closed" class="glass card closed" hidden>
    <img src="assets/glimming.png" alt="">
    <span class="badge">응답 마감</span>
    <div class="title">응답이 마감되었어요</div>
    <p class="desc">참여해 주셔서 고마워요.<br>앞쪽 화면에서 함께 모은 단어를 확인해 보세요.</p>
    <div id="closed-mine" hidden style="display:contents">
      <div class="divider"></div>
      <div class="label">내가 보낸 단어</div>
      <div class="chips" id="closed-chips"></div>
    </div>
  </section>
</main>

<div class="send-bar" id="send-bar" hidden>
  <div class="inner"><button type="button" class="btn-coral" id="send" disabled>보내기</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/join.js"></script>
</body>
</html>
